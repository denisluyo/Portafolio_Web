<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denis Luyo | Nueva página</title>
  <style>
    :root {
      --bg: #050505;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: #b7b7c2;
      --primary: #7c3aed;
      --accent: #bef264;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.28), transparent 34%),
        radial-gradient(circle at 80% 70%, rgba(190, 242, 100, 0.18), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: 44px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff;
      color: #050505;
      font-size: 22px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 32px;
      max-width: 480px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--primary);
    }

    .button-secondary {
      background: var(--accent);
      color: #101010;
    }

    @media (max-width: 560px) {
      main {
        padding: 32px 22px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">DL</div>
    <h1>Elige tu siguiente destino</h1>
    <p>Accede a mi web principal o agenda una asesoría gratuita para revisar tu producto digital.</p>

    <div class="actions">
      <a class="button button-primary" href="https://www.denisluyo.com">Ahora deben ir a esta web</a>
      <a class="button button-secondary" href="https://designpartner.denisluyo.com">Asesoría gratis</a>
    </div>
  </main>
</body>
</html>
